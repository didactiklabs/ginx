name: GoReleaser Dry Run
on:
  pull_request:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Run GoReleaser (dry run)
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --snapshot # Perform a dry run
          version: "~> v2"
